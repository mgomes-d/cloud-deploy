---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

# Avoid full dist-upgrade: it often pulls large kernel packages
# and fails on small disks (common on free-tier / small EC2).
# Only install what we actually need.

- name: Install basic packages
  ansible.builtin.apt:
    name:
      - curl
      - wget
      - git
      - vim
      - htop
      - unzip
      - ca-certificates
      - gnupg
      - lsb-release
      - python3-pip
      - python3-docker
    state: present
    update_cache: true

- name: Remove unused packages and clean apt cache
  ansible.builtin.apt:
    autoremove: true
    autoclean: true

- name: Set timezone
  community.general.timezone:
    name: "{{ timezone }}"
  when: timezone is defined
