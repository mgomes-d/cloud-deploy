---
- name: Create application directory
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

- name: Synchronize project files to the server
  ansible.posix.synchronize:
    src: "{{ playbook_dir }}/../docker/"
    dest: "{{ app_dir }}/"
    use_ssh_args: true
    delete: true
    private_key: "{{ ansible_ssh_private_key_file }}"
    rsync_opts:
      - "--exclude=.git"
      - "--exclude=.env"
      - "--exclude=certs"
  delegate_to: localhost
  become: false

- name: Copy .env file
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../docker/.env"
    dest: "{{ app_dir }}/.env"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"

- name: Ensure WordPress environment variables are set in .env
  ansible.builtin.lineinfile:
    path: "{{ app_dir }}/.env"
    regexp: "^{{ item.key }}="
    line: "{{ item.key }}={{ item.value }}"
    create: true
  loop:
    - { key: "WORDPRESS_URL", value: "{{ wordpress_url }}" }
    - { key: "WORDPRESS_ADMIN_USER", value: "{{ wordpress_admin_user }}" }
    - { key: "WORDPRESS_ADMIN_PASSWORD", value: "{{ wordpress_admin_password }}" }
    - { key: "WORDPRESS_ADMIN_EMAIL", value: "{{ wordpress_admin_email }}" }
    - { key: "WORDPRESS_TITLE", value: "{{ wordpress_title }}" }
  become: false

- name: Ensure certs directory exists with correct ownership
  ansible.builtin.file:
    path: "{{ app_dir }}/certs"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

- name: Check if TLS certificate already exists
  ansible.builtin.stat:
    path: "{{ app_dir }}/certs/fullchain.pem"
  register: cert_stat

- name: Generate self-signed TLS certificate on the server
  ansible.builtin.command:
    cmd: >
      openssl req -x509 -nodes -days 365
      -newkey rsa:2048
      -keyout {{ app_dir }}/certs/privkey.pem
      -out {{ app_dir }}/certs/fullchain.pem
      -subj "/CN={{ domain_name }}"
  become: false
  when: not cert_stat.stat.exists

- name: Ensure certificate files have correct ownership
  ansible.builtin.file:
    path: "{{ item }}"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"
  loop:
    - "{{ app_dir }}/certs/fullchain.pem"
    - "{{ app_dir }}/certs/privkey.pem"
  when: cert_stat.stat.exists

- name: Start the application with Docker Compose
  community.docker.docker_compose_v2:
    project_src: "{{ app_dir }}"
    state: present
    pull: always
  become: false
